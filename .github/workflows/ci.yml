name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    # 🐘 Service PostgreSQL pour les tests d'intégration (Prisma)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petfosterconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # URL pointant vers le service ci-dessus
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petfosterconnect_test?schema=public
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Lint & Formatting (Biome)
        run: npm run lint

      - name: Build Shared Types
        run: npm run build:shared

      - name: Generate Prisma Client (Backend)
        run: npm run prisma:generate

      # ⚡ Synchronisation du schéma avec la base de données de test
      - name: Prepare Test Database
        run: npm run prisma --workspace=backend -- db push --accept-data-loss

      - name: Type-check (Monorepo)
        run: npm run type-check

      - name: Run Unit & Integration Tests
        run: npm run test -- --run

      - name: Build Backend
        run: npm run build:backend

      - name: Build Frontend
        run: npm run build:frontend
