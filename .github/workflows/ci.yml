name: CI

on:
  push:
    # Déclenche la CI sur n'importe quel push (main ou branche de feature)
    branches: [ "**" ]
  pull_request:
    # Déclenche la CI lors d'une Merge Request vers main
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check Lint & Formatting (Biome)
        run: npm run lint

      - name: Build Shared Types
        run: npm run build:shared

      - name: Generate Prisma Client (Backend)
        run: npm run prisma:generate

      - name: Type-check (Monorepo)
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

      - name: Build Backend
        run: npm run build:backend

      - name: Build Frontend
        run: npm run build:frontend
